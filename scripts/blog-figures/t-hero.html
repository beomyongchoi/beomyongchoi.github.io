<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="term.css">
<style>
  .page{width:860px;height:345px;background:#0d1117;display:flex;align-items:center;justify-content:center;padding:0}
  .body{padding:34px 40px}
  .title{margin:6px 0 26px;font-size:38px;font-weight:800;letter-spacing:-.02em;color:#f0f6fc}
  .title .en{color:var(--blu)}
  .row{display:flex;align-items:center;gap:16px;font-size:26px;margin:14px 0}
  .row .lab{width:150px;color:var(--dim);font-size:19px}
  .row .barch{letter-spacing:-1px;font-size:26px}
  .row .num{font-size:24px;font-weight:800;width:70px}
  .row .note{color:var(--cmt);font-size:16px}
  .cmd{font-size:18px;margin-bottom:6px}
  .kicker{margin-top:26px;font-size:17px;color:var(--tx)}
  .kicker .ar{color:var(--grn);font-weight:700}
</style></head><body>
  <div class="page"><div class="win">
    <div class="bar"><span class="dot dr"></span><span class="dot dy"></span><span class="dot dg"></span><span class="path">~/blog/ai-coding-paradox</span></div>
    <div class="body">
      <div class="cmd"><span class="p">$</span> dev-survey <span class="a">2025</span> <span class="s">--topic</span> "ai-coding"</div>
      <div class="title">AI 코딩의 역설 <span class="en">/ The AI Coding Paradox</span></div>
      <div class="row b-blu"><span class="lab">adoption</span><span class="barch"><span class="f">████████████████</span><span class="e">░░░░</span></span><span class="num" style="color:var(--blu)">84%</span><span class="note"># 거의 다 쓴다</span></div>
      <div class="row b-org"><span class="lab">trust</span><span class="barch"><span class="f">██████</span><span class="e">░░░░░░░░░░░░░░</span></span><span class="num" style="color:var(--org)">29%</span><span class="note"># 믿진 않는다</span></div>
      <div class="kicker"><span class="ar">&gt;</span> 모두가 AI로 코드를 짠다. 그런데 그 결과를 믿는 사람은 드물다.</div>
    </div>
  </div></div>
</body></html>
